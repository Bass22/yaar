# La pile complète : le web derrière Caddy, l'API, la base — docs/architecture.md §9.
# Repris de build-track (docker-compose.yml). Ce fichier est celui du développement ; la
# production lui ajoute une surcouche (domaine, HTTPS, sauvegardes : tranche Z.5).
#
#   cp infra/.env.example infra/.env      # puis remplir DB_PASSWORD
#   docker compose -f infra/docker-compose.yml up --build
#
# Une seule porte sur l'extérieur : `web`. Ni l'API ni la base ne publient de port ; elles
# ne sont jointes que sur les réseaux internes du compose. Publier l'API ouvrirait une
# seconde origine, sans en-têtes de sécurité, et « CORS jamais activé » deviendrait faux.
#
# Deux réseaux : `edge` (Caddy ↔ API) et `data` (API ↔ base). Caddy, seul conteneur exposé,
# n'a aucun chemin vers la base.
name: yaar

services:
  db:
    # Pinned by digest (R-10): a tag can be moved under us; a digest cannot. Raised by hand.
    image: postgres:16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9
    restart: unless-stopped
    environment:
      # The superuser initialises the server, then loses its password (init-roles.sh): it is
      # reached only from inside this container — `docker compose exec db psql -U postgres` (D.6).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?définir DB_PASSWORD dans infra/.env avant de démarrer}
      # Read by the init script below, once, to create the owner of the tables and the role
      # of the API, and the database `yaar` owned by the first.
      DB_PASSWORD: ${DB_PASSWORD:?définir DB_PASSWORD dans infra/.env avant de démarrer}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?définir APP_DB_PASSWORD dans infra/.env avant de démarrer}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks:
      - data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yaar -d yaar']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot task: applies the committed migrations as the owner of the database, then exits.
  # The API starts only once it has succeeded, so it never serves on a schema it does not know.
  migrate:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: migrate
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://yaar:${DB_PASSWORD:?DB_PASSWORD manquant}@db:5432/yaar
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: 3000
      # The application role: it owns no table and is bound by row-level security. The owner
      # role and its password never reach this container.
      DATABASE_URL: postgresql://yaar_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD manquant}@db:5432/yaar
      # Signs the session tokens. Changing it signs everyone out.
      JWT_SECRET: ${JWT_SECRET:?définir JWT_SECRET dans infra/.env avant de démarrer}
      # The media volume (M.1): photos kept under their fingerprint, never removed.
      MEDIA_PATH: /data/medias
      # Notifications (Y.1, Y.2a): the pair and the operator's contact, the three or none — none:
      # notifications are neither offered nor sent. The private key reaches this container only.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - medias:/data/medias
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - data
    # Readiness, not liveness: Caddy only gets an API whose database answers.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://localhost:3000/api/v1/health/ready')
          .then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:80'
    networks:
      - edge
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:8081/healthz || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5

  # The encryption of the backups (Z.4), run on demand by infra/backup/*.sh — never started
  # with the stack. Cut off from every network: it only turns stdin into stdout.
  age:
    profiles: ['tools']
    build:
      context: ..
      dockerfile: infra/docker/age.Dockerfile
    network_mode: none

networks:
  edge:
  data:
    # No route to the outside: the database cannot be reached from, or reach, the internet.
    internal: true

volumes:
  db-data:
  medias:
